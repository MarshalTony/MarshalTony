# Nightly off-site logical backup (in addition to the database provider's own snapshots/PITR).
# Requires repository secrets: PROD_DATABASE_URL (the DIRECT/session connection, not the transaction pooler), BACKUP_S3_URI, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# AWS_ENDPOINT_URL (e.g. https://<account>.r2.cloudflarestorage.com), BACKUP_GPG_PUBLIC_KEY, BACKUP_GPG_RECIPIENT.
name: Nightly database backup
on:
  schedule:
    - cron: "17 0 * * *"   # 03:17 Kampala time
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
      - name: Import backup encryption key
        run: echo "${{ secrets.BACKUP_GPG_PUBLIC_KEY }}" | gpg --batch --import
      - name: Back up
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          BACKUP_GPG_RECIPIENT: ${{ secrets.BACKUP_GPG_RECIPIENT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: auto
        run: bash scripts/backup.sh /tmp/backups
